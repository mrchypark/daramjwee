version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - gosec
    - makezero
    - misspell
    - nilerr
    - noctx
    - prealloc
    - unconvert
    - unparam
    - wastedassign
  settings:
    errcheck:
      check-type-assertions: true
    gosec:
      excludes:
        - G104
    govet:
      enable:
        - shadow
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - errcheck
          - gosec
        path: examples/
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mrchypark/daramjwee
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
