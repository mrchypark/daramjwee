run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - bodyclose
    - durationcheck
    - errname
    - errorlint
    - exportloopref
    - makezero
    - nilerr
    - noctx
    - prealloc
    - unconvert
    - unparam
    - wastedassign
    - gosec
    - misspell
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable:
      - shadow
  goimports:
    local-prefixes: github.com/mrchypark/daramjwee
  gosec:
    excludes:
      - G104  # unhandled errors - too noisy for initial adoption

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
        - unparam
    - path: examples/
      linters:
        - errcheck
        - gosec
